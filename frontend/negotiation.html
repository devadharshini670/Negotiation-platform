<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Negotiation Area — AI Multi-Agent Negotiation Platform</title>
<link rel="stylesheet" href="style.css"><script src="api.js"></script></head>
<body><script>document.write(nav('home'))</script>
<main id="main"><div class="wrap">
<div class="eyebrow">Step 04 · Negotiation Area</div>
<div class="area-head">
  <div><h1 class="page-title" id="title">Negotiation Area</h1><p class="page-sub" id="sub"></p></div>
  <div class="head-pills"><span class="pill-lg" id="modePill"></span><span class="notice" id="round">Round —</span><span class="status-pill" id="statusPill">—</span></div>
</div>
<div id="banner" aria-live="polite"></div>
<div class="live-shell">
  <aside class="card sidebar" aria-label="Participants and orchestrator">
    <div class="side-title">Participants</div><div id="participants"></div>
    <div class="side-title" style="margin-top:20px">Orchestrator activity</div><div class="orch-log" id="orch"></div>
    <div class="side-title">Round progress</div><div class="progress"><span id="prog" style="width:0%"></span></div>
  </aside>

  <section class="card conversation" aria-label="Negotiation transcript">
    <div class="side-title">Negotiation transcript</div>
    <div class="timeline" id="timeline" aria-live="polite"><div class="empty">Initializing…</div></div>

    <div class="controlbar" id="simControls" style="margin-top:14px;display:none">
      <button class="btn" id="pause">Pause</button>
      <button class="btn secondary" id="step">Next turn</button>
      <button class="btn secondary" id="run">Skip to end</button>
    </div>

    <div class="practice-panel" id="practicePanel" style="display:none">
      <div class="chat-composer">
        <div class="composer-head"><h3 id="composeTitle">Your move</h3><span class="chat-hint" id="composeHint"></span></div>
        <div class="facts" id="facts"></div>
        <div class="seg" role="group" aria-label="Choose your action">
          <button data-act="counter" aria-pressed="true">Make an offer</button>
          <button data-act="accept" aria-pressed="false">Accept latest offer</button>
          <button data-act="reject" aria-pressed="false">Reject &amp; walk away</button>
        </div>
        <div class="valuebox" id="valueBox"><span id="unit">$</span><input id="humanValue" type="number" step="any" inputmode="decimal" placeholder="Your offer" aria-label="Your offer amount"></div>
        <div class="fielderr" id="fieldErr" role="alert"></div>
        <label for="humanMessage" class="side-title" style="margin-bottom:6px;display:block">Message to the other party (optional — tone matters)</label>
        <textarea id="humanMessage" maxlength="1000" placeholder="Example: I can move on price if we agree a longer-term commitment. What flexibility do you have?"></textarea>
        <div class="controlbar" style="margin-top:10px"><button class="btn" id="human">Send</button><button class="btn secondary" id="sendMessage">Send message only</button></div>
        <div class="chat-row"><span class="chat-hint">Practice Mode · you are <b id="youRole">Agent A</b>. The AI answers your actual move in real time.</span></div>
      </div>
    </div>

    <div class="outcome" id="outcome" style="display:none"></div>
  </section>

  <aside class="card intel" aria-label="Live negotiation metrics">
    <div class="side-title">Negotiation metrics</div><div id="intel"></div>
    <div class="side-title" style="margin-top:20px">Offer movement</div><div id="chart"></div>
    <div class="side-title" style="margin-top:20px">Concession movement</div><div id="concessions"></div>
  </aside>
</div>
</div></main>
<script>
const id = Session.get().negotiationId;
let sc = null, S = null, busy = false, paused = false, looping = false, pending = null, pAction = 'counter', celebrated = false;
const $ = x => document.getElementById(x);
const toast = m => { const t = Object.assign(document.createElement('div'), { className: 'toast', textContent: m, role: 'status' }); document.body.appendChild(t); setTimeout(() => t.remove(), 3500); };
const role = (s, aid) => (s.agents.find(a => a.id === aid) || {}).role_label || aid;
const isHumanSide = (s, a) => s.workflow_mode === 'practice' && a.id === s.agents[0].id;
const terminal = s => TERMINAL.includes(s.status);
const better = (a, v, w) => a.direction === 'maximize' ? v >= w : v <= w;

function banner(html, kind = '') { $('banner').innerHTML = html ? `<div class="banner ${kind}">${html}</div>` : ''; }
function noBackend(msg) {
  $('timeline').innerHTML = `<div class="empty">${esc(msg)}<br><br><a class="btn" href="index.html">Start a new negotiation</a></div>`;
  $('title').textContent = 'Negotiation Area';
}

function render(s) {
  S = s;
  const u = sc.unit, practice = s.workflow_mode === 'practice', done = terminal(s);
  $('title').textContent = sc.name;
  $('sub').textContent = sc.description;
  $('modePill').textContent = practice ? 'Practice Mode · You vs AI' : 'Simulation Mode · AI vs AI';
  $('round').textContent = `Round ${Math.min(s.current_round, s.max_rounds)} / ${s.max_rounds}`;
  $('statusPill').textContent = STATUS[s.status]; $('statusPill').className = 'status-pill ' + s.status;
  $('prog').style.width = (done ? (s.status === 'agreed' ? 100 : Math.min(100, s.current_round / s.max_rounds * 100)) : Math.min(100, (s.current_round - 1) / s.max_rounds * 100 + (s.history.filter(o => o.round === s.current_round).length ? 100 / s.max_rounds / 2 : 0))) + '%';

  // banners: engine downgrade, fallback, errors
  let msg = '', kind = '';
  if (s.mode_notice) { msg = esc(s.mode_notice); kind = 'warn'; }
  if (s.mode === 'llm' && s.fallback_count) { msg += `${msg ? '<br>' : ''}${s.fallback_count} turn(s) used the RULE-BASED fallback (not the ${esc(s.llm_provider || 'LLM')} model) because the call failed or returned an unusable answer${s.last_error ? ` — ${esc(s.last_error)}` : ''}.`; kind = 'warn'; }
  if (!msg && s.mode === 'llm') { msg = `Real LLM mode · ${esc(s.llm_provider || '')} · ${esc(s.llm_model || '')}`; }
  banner(msg, kind);

  // participants
  const lastStance = aid => { const o = [...s.history].reverse().find(x => x.agent_id === aid && x.stance); return o ? o.stance : null; };
  $('participants').innerHTML = s.agents.map(a => {
    const active = !done && a.id === s.current_turn_agent_id;
    const thinking = active && busy && !(practice && a.id === s.agents[0].id);
    return `<div class="participant ${active ? 'active' : ''} ${thinking ? 'thinking' : ''}"><div class="participant-row">${avatarHTML(a.role_label, a.personality, { human: isHumanSide(s, a), active, thinking })}<div class="participant-body"><b>${esc(a.role_label)}${isHumanSide(s, a) ? ' <span class="tag" style="background:#dfeaee;padding:1px 8px;border-radius:99px;font-size:10px">YOU</span>' : ''}</b><small>${isHumanSide(s, a) ? 'Human participant' : esc(P[a.personality].label)} · ${a.direction === 'maximize' ? 'Maximize' : 'Minimize'}</small><span class="stance">${lastStance(a.id) ? 'Stance: ' + esc(lastStance(a.id)) : active ? (thinking ? 'Reasoning…' : 'Turn in progress') : 'Waiting'}</span></div></div></div>`;
  }).join('');

  // orchestrator activity (real events)
  const recent = s.history.slice(-5);
  const log = recent.map(o => `<div><b>R${o.round} · ${esc(role(s, o.agent_id))}</b> → ${esc((ACTION[o.action] || o.action).toLowerCase())}${o.value != null ? ' ' + esc(money(o.value, u)) : ''}<br><span style="color:#71808a">${esc(sourceLabel(o.source, s))} · ${o.corrected ? 'validated, adjusted by Orchestrator' : 'validated'}</span></div>`).join('');
  const tail = done ? `<div><b>Ended</b> · ${esc(STATUS[s.status])}</div>` : `<div class="next">Next: ${esc(role(s, s.current_turn_agent_id))}${busy ? ' (reasoning…)' : ''}</div>`;
  $('orch').innerHTML = (log || '<div>Waiting for the first turn.</div>') + tail;

  // transcript
  const rec = {}; s.concessions.forEach(c => rec[c.agent_id + ':' + c.round] = c);
  $('timeline').innerHTML = (s.history.length ? s.history.map(o => {
    const ag = s.agents.find(a => a.id === o.agent_id), i = s.agents.indexOf(ag), me = isHumanSide(s, ag);
    const c = rec[o.agent_id + ':' + o.round];
    const mv = c && (o.action === 'open' || o.action === 'counter') ? `<span class="move ${c.kind}">${c.kind === 'concession' ? '▸ Conceded ' + esc(money(Math.abs(c.delta), u)) + ' (' + c.pct_of_range + '%)' : c.kind === 'hold' ? '▸ Held position' : '▸ Moved backwards'}</span>` : '';
    return `<article class="bubble ${me ? 'human' : i ? 'b' : 'a'} decision-${o.action}"><div class="bubble-head"><span>R${o.round} · ${esc(role(s, o.agent_id))}${me ? '<span class="tag">You</span>' : ''}</span><span class="action">${esc(ACTION[o.action] || o.action)}</span></div>${o.value != null ? `<div class="offer-value">${money(o.value, u)}</div>` : ''}${o.stance ? `<span class="stance-badge">${esc(o.stance)}</span>` : ''}${mv}${o.message ? `<div class="message-text">${esc(o.message)}</div>` : ''}${o.action !== 'message' && o.rationale && o.rationale !== o.message ? `<div class="rationale"><b>Reasoning · </b>${esc(o.rationale)}</div>` : ''}${o.corrected ? `<div class="adjust">Orchestrator: ${esc(o.correction_note)}</div>` : ''}<div class="bubble-head" style="margin-top:9px;margin-bottom:0"><span>${esc(sourceLabel(o.source, s))}</span><span>${new Date(o.timestamp).toLocaleTimeString()}</span></div></article>`;
  }).join('') : `<div class="empty">${practice ? 'You open the negotiation. Make your first offer or send a message below.' : 'The Orchestrator is ready. The simulation starts automatically.'}</div>`)
    + (busy && pending ? `<div class="typing" role="status"><span class="dots"><i></i><i></i><i></i></span>${esc(pending)}</div>` : '');
  const tl = $('timeline'); tl.scrollTop = tl.scrollHeight;

  // metrics
  const pubs = s.history.filter(o => o.value != null), last = pubs[pubs.length - 1];
  const [a0, a1] = s.agents;
  const l0 = [...s.history].reverse().find(o => o.agent_id === a0.id && (o.action === 'open' || o.action === 'counter'));
  const l1 = [...s.history].reverse().find(o => o.agent_id === a1.id && (o.action === 'open' || o.action === 'counter'));
  const gap = l0 && l1 ? Math.abs(l0.value - l1.value) : null;
  const cnt = a => s.concessions.filter(c => c.agent_id === a.id && c.kind === 'concession').length;
  const mom = computeMomentum(s.agents, s.history, s.status);
  const gaugeHtml = mom ? `<div class="momentum-wrap">${gaugeSVG(mom.pct)}<div class="momentum-copy"><b>${esc(mom.label)}</b><span>${esc(mom.detail)}</span></div></div>` : '';
  $('intel').innerHTML = gaugeHtml + [
    ['Status', STATUS[s.status]], ['Current turn', done ? '—' : role(s, s.current_turn_agent_id)], ['Latest offer', last ? money(last.value, u) : '—'],
    ['Gap between positions', gap != null ? money(gap, u) : '—'], ['Offers made', s.history.filter(o => o.action === 'open' || o.action === 'counter').length],
    [`Concessions · ${role(s, a0.id)}`, cnt(a0)], [`Concessions · ${role(s, a1.id)}`, cnt(a1)],
    [`Repeated offers · ${role(s, a0.id)} / ${role(s, a1.id)}`, `${(s.repeat_streaks || {})[a0.id] || 0} / ${(s.repeat_streaks || {})[a1.id] || 0}  (limit 2)`], ['Engine', engineLabel(s)], ['LLM calls / fallbacks', `${s.llm_calls} / ${s.fallback_count}`], ['Orchestrator corrections', s.orchestrator_corrections]
  ].map(m => `<div class="metric"><span>${esc(m[0])}</span><strong>${esc(m[1])}</strong></div>`).join('') +
    `<div class="metric" style="display:block"><span>Stalled rounds</span><strong style="float:right">${s.stall_rounds} / 2</strong><div class="meter"><span style="width:${Math.min(100, s.stall_rounds / 2 * 100)}%"></span></div></div>`;
  $('chart').innerHTML = offerChart(s.agents, s.history, u, s.status === 'agreed' ? s.final_value : null, true);
  $('concessions').innerHTML = s.concessions.length ? s.concessions.slice(-6).map(c => `<div class="metric"><span>R${c.round} · ${esc(role(s, c.agent_id))}</span><strong>${c.kind === 'hold' ? 'held' : (c.kind === 'retreat' ? '↩ ' : '') + (c.delta > 0 ? '+' : '') + Number(c.delta).toLocaleString()}</strong></div>`).join('') : '<div class="empty" style="padding:10px">No movement recorded yet.</div>';

  // controls
  const humanTurn = practice && !done && s.human_turn;
  $('practicePanel').style.display = humanTurn ? 'block' : 'none';
  $('simControls').style.display = (!practice && !done) || (practice && !done && !humanTurn) ? 'flex' : 'none';
  $('pause').style.display = practice ? 'none' : 'inline-block';
  $('pause').textContent = paused ? 'Resume simulation' : 'Pause';
  $('step').disabled = $('run').disabled = busy || done;
  $('step').textContent = practice ? 'Get AI response' : 'Next turn';
  if (humanTurn) renderComposer(s);
  if (done) showOutcome(s);
  else $('outcome').style.display = 'none';
  if (s.status === 'agreed' && !celebrated) { celebrated = true; celebrate(); }
}

function showOutcome(s) {
  const u = sc.unit, o = $('outcome');
  const head = { agreed: 'Agreement reached', deadlock: 'Deadlock declared', rejected: 'Negotiation rejected', max_rounds_reached: 'Maximum rounds reached' }[s.status] || 'Negotiation completed';
  o.style.display = 'block';
  o.innerHTML = `<div class="eyebrow">Result</div><h2>${head}${s.final_value != null ? ' · ' + esc(money(s.final_value, u)) : ''}</h2><p style="color:var(--muted)">${esc(s.outcome_reason)}</p>
  <div class="stats"><div class="card stat"><label>Rounds</label><b>${Math.min(s.current_round, s.max_rounds)}/${s.max_rounds}</b></div><div class="card stat"><label>Turns</label><b>${s.history.length}</b></div><div class="card stat"><label>Concessions</label><b>${s.concessions.filter(c => c.kind === 'concession').length}</b></div><div class="card stat"><label>Engine</label><b style="font-size:16px">${esc(engineLabel(s))}</b></div></div>
  <p style="margin-top:16px"><a class="btn" href="outcome.html?id=${encodeURIComponent(s.id)}">View Negotiation Outcome →</a></p>`;
}

function renderComposer(s) {
  const me = s.agents[0], ai = s.agents[1], u = sc.unit;
  const aiOffer = [...s.history].reverse().find(o => o.agent_id === ai.id && (o.action === 'open' || o.action === 'counter'));
  const mine = [...s.history].reverse().find(o => o.agent_id === me.id && (o.action === 'open' || o.action === 'counter'));
  $('composeTitle').textContent = `Your move — ${me.role_label}`;
  $('composeHint').textContent = `Round ${s.current_round} of ${s.max_rounds}`;
  $('youRole').textContent = me.role_label; $('unit').textContent = u; $('valueBox').classList.toggle('suffix', /^[A-Za-z]/.test(u));
  $('facts').innerHTML = [
    [`${ai.role_label}'s latest offer`, aiOffer ? money(aiOffer.value, u) : 'No offer yet'], ['Your last offer', mine ? money(mine.value, u) : '—'],
    ['Your target', money(me.target, u)], ['Your hard limit', money(me.limit, u)]
  ].map(f => `<div class="fact"><label>${esc(f[0])}</label><b>${esc(f[1])}</b></div>`).join('');
  const canAccept = aiOffer && better(me, aiOffer.value, me.limit);
  const accBtn = document.querySelector('.seg [data-act="accept"]');
  accBtn.disabled = !aiOffer || !canAccept; accBtn.title = aiOffer && !canAccept ? 'This offer is beyond your hard limit — counter or reject instead' : '';
  if (pAction === 'accept' && (!aiOffer || !canAccept)) pAction = 'counter';
  setAction(pAction);
}
function setAction(a) {
  pAction = a;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.act === a));
  $('valueBox').style.display = a === 'counter' ? 'flex' : 'none';
  $('human').textContent = { counter: 'Send offer', accept: 'Accept & close deal', reject: 'Reject & end negotiation' }[a];
  $('fieldErr').textContent = '';
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setAction(b.dataset.act));

async function doAI(fn, label) {           // run one backend action while showing live "reasoning" state
  if (busy) return; busy = true;
  const next = S && S.agents.find(a => a.id === S.current_turn_agent_id);
  pending = label || (next ? `${next.role_label} is reasoning…` : 'Reasoning…');
  if (S) render(S);
  try { const s = await fn(); busy = false; pending = null; render(s); return s; }
  catch (e) { busy = false; pending = null; if (S) render(S); banner(esc(e.message) + ' <button class="btn small secondary" onclick="location.reload()">Reload</button>', 'error'); throw e; }
}

async function autoplay() {
  if (looping) return; looping = true;
  try {
    while (S && !terminal(S) && !paused && S.workflow_mode === 'simulation') {
      await doAI(() => Api.step(id));
      await sleep(S.mode === 'llm' ? 300 : 1000);
    }
  } catch { /* banner already shown */ } finally { looping = false; render(S); }
}

$('pause').onclick = () => { paused = !paused; render(S); if (!paused) autoplay(); };
$('step').onclick = async () => { paused = true; try { await doAI(() => Api.step(id)); } catch {} };
$('run').onclick = async () => { paused = true; try { await doAI(() => Api.run(id), 'Running the remaining turns…'); } catch {} };

$('human').onclick = async () => {
  const msg = $('humanMessage').value.trim(), raw = $('humanValue').value.trim(), me = S.agents[0];
  $('fieldErr').textContent = '';
  const body = { action: pAction, message: msg };
  if (pAction === 'counter') {
    const v = Number(raw);
    if (!raw || !Number.isFinite(v) || v <= 0) { $('fieldErr').textContent = 'Enter a valid positive amount.'; $('humanValue').focus(); return; }
    const mineLast = [...S.history].reverse().find(o => o.agent_id === me.id && (o.action === 'open' || o.action === 'counter'));
    if (mineLast && (me.direction === 'minimize' ? v < mineLast.value : v > mineLast.value)) { $('fieldErr').textContent = `You cannot move backwards: your previous offer was ${money(mineLast.value, sc.unit)}. Hold or concede instead.`; return; }
    if (!better(me, v, me.limit)) { $('fieldErr').textContent = `That is beyond your hard limit of ${money(me.limit, sc.unit)}.`; return; }
    body.value = v;
  }
  if (pAction === 'reject' && !confirm('Rejecting ends the negotiation with no agreement. Continue?')) return;
  try {
    pending = `${S.agents[1].role_label} is reasoning about your move…`;
    await doAI(() => Api.human(id, body), pending);
    $('humanMessage').value = ''; $('humanValue').value = '';
  } catch (e) { $('fieldErr').textContent = e.message; banner('', ''); }
};
$('sendMessage').onclick = async () => {
  const msg = $('humanMessage').value.trim();
  if (!msg) { $('fieldErr').textContent = 'Write a message first.'; return; }
  try { await doAI(() => Api.human(id, { action: 'message', message: msg }), `${S.agents[1].role_label} is reading your message…`); $('humanMessage').value = ''; }
  catch (e) { $('fieldErr').textContent = e.message; banner('', ''); }
};

(async () => {
  if (!(await authGuard())) return;
  if (!id) return noBackend('No active negotiation. Choose a scenario to begin.');
  try {
    const [s, xs] = await Promise.all([Api.get(id), Api.scenarios()]);
    sc = xs.find(x => x.id === s.scenario_id);
    paused = false; render(s);
    if (s.workflow_mode === 'simulation' && !terminal(s)) autoplay();
  } catch (e) {
    noBackend(e.status === 404 ? 'This negotiation is no longer available (the server may have restarted).' : e.message);
  }
})();
engineBadge();
</script></body></html>
