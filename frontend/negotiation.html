<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Negotiation — The Table</title><link rel="stylesheet" href="style.css"><script src="api.js"></script></head><body><script>document.write(nav('home'))</script><main><div class="wrap"><div class="eyebrow">Step 04 · Live negotiation</div><div style="display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px"><div><h1 class="page-title" id="title">Live negotiation</h1><p class="page-sub" id="sub"></p></div><div class="notice" id="round">Round —</div></div><div class="live-shell"><aside class="card sidebar"><div class="side-title">Participants</div><div id="participants"></div><div class="side-title" style="margin-top:22px">Orchestrator</div><div class="orchestrator" id="orch"></div><div class="side-title">Progress</div><div class="progress"><span id="prog" style="width:0%"></span></div></aside><section class="card conversation"><div class="side-title">Negotiation transcript</div><div class="timeline" id="timeline"><div class="empty">Initializing negotiation…</div></div><div class="controlbar"><button class="btn" id="step">Execute next AI turn</button><button class="btn secondary" id="run">Run to completion</button></div><div class="practice-panel" id="practicePanel" style="display:none"><div class="chat-composer"><div class="side-title" style="margin-bottom:8px">Your negotiation message</div><textarea id="humanMessage" maxlength="1000" placeholder="Example: We can move on price if delivery is included. What flexibility do you have?"></textarea><div class="controlbar" style="margin-top:10px"><select id="humanAction"><option value="counter">Make counteroffer</option><option value="open">Make opening offer</option><option value="accept">Accept proposal</option><option value="reject">Reject proposal</option></select><input id="humanValue" type="number" step="0.01" placeholder="Offer amount"><button class="btn" id="human">Send proposal</button><button class="btn secondary" id="sendMessage">Send message only</button></div><div class="chat-row"><span class="chat-hint">Practice Mode · You are Agent A. The AI will respond after your message or proposal.</span></div></div></div><div class="outcome" id="outcome" style="display:none"></div></section><aside class="card intel"><div class="side-title">Negotiation intelligence</div><div id="intel"></div><div class="side-title" style="margin-top:22px">Concession movement</div><div id="concessions"></div></aside></div></div></main><script>
const id=Session.get().negotiationId;let sc=null;async function render(){const s=await Api.get(id);if(!sc){const xs=await Api.scenarios();sc=xs.find(x=>x.id===s.scenario_id);document.getElementById('title').textContent=sc.name;document.getElementById('sub').textContent=sc.description}document.getElementById('round').textContent=(s.workflow_mode==='practice'?'Practice · ':'')+`Round ${Math.min(s.current_round,s.max_rounds)} / ${s.max_rounds}`;document.getElementById('prog').style.width=Math.min(100,s.history.length/(s.max_rounds*2)*100)+'%';document.getElementById('participants').innerHTML=s.agents.map(a=>`<div class="participant ${a.id===s.current_turn_agent_id&&!s.status.includes('agreed')?'active':''}"><b>${esc(a.role_label)}</b><small>${esc(P[a.personality].label)} · ${a.direction==='maximize'?'Maximize':'Minimize'}</small></div>`).join('');document.getElementById('orch').innerHTML=['Load state','Load agent profile','Evaluate current offer','Generate response','Validate decision','Update state','Switch turn'].map((x,i)=>`<div class="orchestrator-line ${i<Math.min(6,s.history.length%7)?'done':''} ${i===Math.min(6,s.history.length%7)?'current':''}"><i></i>${x}</div>`).join('');document.getElementById('timeline').innerHTML=s.history.length?s.history.map((o,i)=>`<div class="bubble ${o.agent_id===s.agents[0].id?'a':'b'}"><div class="bubble-head"><span>R${o.round} · ${esc(s.agents.find(a=>a.id===o.agent_id)?.role_label||o.agent_id)}</span><span class="action">${o.action}</span></div>${o.value!=null?`<div class="offer-value">${money(o.value,sc.unit)}</div>`:''}${o.message?`<div class="message-text">${esc(o.message)}</div>`:''}<div class="rationale">${o.action==='message'?'Message sent to the other participant.':esc(o.rationale)}</div><div class="bubble-head" style="margin-top:9px;margin-bottom:0"><span>${o.source==='llm'?'Live LLM':'Deterministic engine'}</span><span>${new Date(o.timestamp).toLocaleTimeString()}</span></div></div>`).join(''):`<div class="empty">The Orchestrator is ready. Execute the first turn.</div>`;const humanTurn=s.workflow_mode==='practice'&&s.current_turn_agent_id===s.agents[0].id&&!['agreed','rejected','deadlock','max_rounds_reached','completed'].includes(s.status);document.getElementById('practicePanel').style.display=humanTurn?'block':'none';document.getElementById('step').style.display=humanTurn?'none':'inline-block';const last=s.history.filter(x=>x.value!=null).slice(-1)[0];const active=s.agents.find(a=>a.id===s.current_turn_agent_id);document.getElementById('intel').innerHTML=`<div class="metric"><span>Status</span><strong>${s.status.replaceAll('_',' ')}</strong></div><div class="metric"><span>Current turn</span><strong>${active?.role_label||'—'}</strong></div><div class="metric"><span>Latest offer</span><strong>${last?money(last.value,sc.unit):'—'}</strong></div><div class="metric"><span>LLM calls</span><strong>${s.llm_calls}</strong></div><div class="metric"><span>Fallbacks</span><strong>${s.fallback_count}</strong></div><div class="metric"><span>Corrections</span><strong>${s.orchestrator_corrections}</strong></div>`;document.getElementById('concessions').innerHTML=s.concessions.length?s.concessions.slice(-6).map(c=>`<div class="metric"><span>R${c.round} · ${esc(s.agents.find(a=>a.id===c.agent_id)?.role_label||c.agent_id)}</span><strong>${c.delta>0?'+':''}${Number(c.delta).toLocaleString()}</strong></div>`).join(''):'<div class="empty" style="padding:10px">No movement recorded yet.</div>';const terminal=s.status!=='in_progress'&&s.status!=='not_started';document.getElementById('step').disabled=terminal;document.getElementById('run').disabled=terminal;if(terminal){document.getElementById('outcome').style.display='block';document.getElementById('outcome').innerHTML=`<div class="eyebrow">Outcome</div><h2>${s.status==='agreed'?'Agreement reached':'Negotiation concluded'}</h2><p style="color:var(--muted)">${esc(s.outcome_reason)}</p><div class="stats"><div class="card stat"><label>Final value</label><b>${s.final_value!=null?money(s.final_value,sc.unit):'—'}</b></div><div class="card stat"><label>Rounds</label><b>${s.current_round}</b></div><div class="card stat"><label>Offers</label><b>${s.history.length}</b></div><div class="card stat"><label>Engine</label><b style="font-size:18px">${s.mode==='llm'?'Real LLM':'Fallback'}</b></div></div><p><a class="btn" href="dashboard.html">View full insights →</a></p>`}}
async function act(fn){document.getElementById('step').disabled=true;document.getElementById('run').disabled=true;try{await fn();await render()}catch(e){alert(e.message)}finally{document.getElementById('step').disabled=false;document.getElementById('run').disabled=false}}
document.getElementById('step').onclick=()=>act(()=>Api.step(id));document.getElementById('human').onclick=()=>{const action=document.getElementById('humanAction').value;const raw=document.getElementById('humanValue').value;const msg=document.getElementById('humanMessage').value.trim();if(!raw&&action!=='reject')return alert('Enter your proposal amount.');act(async()=>{await Api.human(id,{action,value:raw?Number(raw):null,message:msg,rationale:msg||'Human participant submitted a strategic proposal.'});if(action==='counter'||action==='open')await Api.step(id);document.getElementById('humanMessage').value='';document.getElementById('humanValue').value=''})};document.getElementById('sendMessage').onclick=()=>{const msg=document.getElementById('humanMessage').value.trim();if(!msg)return alert('Write a message first.');act(async()=>{await Api.human(id,{action:'message',value:null,message:msg,rationale:msg});await Api.step(id);document.getElementById('humanMessage').value=''})};document.getElementById('run').onclick=()=>act(()=>Api.run(id));render();
</script></body></html>
