<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password — AI Multi-Agent Negotiation Platform</title>
<link rel="stylesheet" href="style.css"><script src="api.js"></script></head>
<body class="auth-shell"><script>document.write(authHeader())</script>
<main id="main"><div class="auth-wrap"><div class="auth-card" style="max-width:460px">
  <h1>Reset your password</h1><p class="sub">Enter your account email and we'll send a reset link.</p>
  <div id="msg"></div>
  <form id="form" novalidate>
    <div class="auth-field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
    <button class="btn auth-submit" id="submit" type="submit">Send reset link</button>
  </form>
  <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
</div></div></main>
<script>
document.getElementById('form').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('submit'); btn.disabled = true; btn.textContent = 'Sending…';
  let text = 'If that email belongs to an account, we have sent instructions to it. Accounts created with Google or GitHub have no password \u2014 use that sign-in option instead.';
  try { text = (await Api.auth.requestPasswordReset(document.getElementById('email').value.trim())).message || text; } catch {}
  document.getElementById('msg').innerHTML = `<div class="auth-success">${esc(text)}</div>`;
  document.getElementById('form').style.display = 'none';
};
</script></body></html>
