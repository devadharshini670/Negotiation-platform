<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set a new password — AI Multi-Agent Negotiation Platform</title>
<link rel="stylesheet" href="style.css"><script src="api.js"></script></head>
<body class="auth-shell"><script>document.write(authHeader())</script>
<main id="main"><div class="auth-wrap"><div class="auth-card">
  <h1>Set a new password</h1><p class="sub">Paste your reset code if it wasn't filled in automatically.</p>
  <div id="msg"></div>
  <form id="form" novalidate>
    <div class="auth-field"><label for="token">Reset code</label><input id="token" required autocomplete="off"></div>
    <div class="auth-field"><label for="password">New password</label><input id="password" type="password" required minlength="8" autocomplete="new-password">
      <div class="pw-meter"><span id="pwBar"></span></div><div class="auth-hint">At least 8 characters, with a letter and a number.</div></div>
    <button class="btn auth-submit" id="submit" type="submit">Update password</button>
  </form>
  <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
</div></div></main>
<script>
const token = new URLSearchParams(location.search).get('token');
if (token) document.getElementById('token').value = token;
const pw = document.getElementById('password');
pw.addEventListener('input', () => {
  const v = pw.value; let score = 0;
  if (v.length >= 8) score++; if (/[A-Za-z]/.test(v) && /[0-9]/.test(v)) score++; if (v.length >= 12) score++; if (/[^A-Za-z0-9]/.test(v)) score++;
  document.getElementById('pwBar').style.width = (score / 4 * 100) + '%';
});
document.getElementById('form').onsubmit = async e => {
  e.preventDefault();
  const msg = document.getElementById('msg'); msg.innerHTML = '';
  const btn = document.getElementById('submit'); btn.disabled = true; btn.textContent = 'Updating…';
  try {
    await Api.auth.resetPassword(document.getElementById('token').value.trim(), pw.value);
    msg.innerHTML = '<div class="auth-success">Password updated. Redirecting to sign in…</div>';
    document.getElementById('form').style.display = 'none';
    setTimeout(() => location.href = 'login.html', 1200);
  } catch (err) { msg.innerHTML = `<div class="auth-error">${esc(err.message)}</div>`; btn.disabled = false; btn.textContent = 'Update password'; }
};
</script></body></html>
