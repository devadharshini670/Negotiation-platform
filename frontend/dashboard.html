<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Insights — The Table</title><link rel="stylesheet" href="style.css"><script src="api.js"></script></head><body><script>document.write(nav('dash'))</script><main><div class="wrap"><div class="eyebrow">Operations intelligence</div><h1 class="page-title">Negotiation insights.</h1><p class="page-sub">Live metrics derived from the negotiation engine. No hard-coded dashboard numbers.</p><div class="dashboard-grid" id="stats"></div><div class="section-head"><div><h2>Recent sessions</h2><p>Every run created by this backend process.</p></div><a class="btn" href="index.html">New negotiation →</a></div><div class="card history"><table><thead><tr><th>Scenario</th><th>Participants</th><th>Engine</th><th>Status</th><th>Result</th><th>Rounds</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
(async()=>{try{const [d,h]=await Promise.all([Api.dashboard(),Api.history()]);document.getElementById('stats').innerHTML=[['Total negotiations',d.total_negotiations],['Agreements',d.agreements],['Agreement rate',d.agreement_rate_pct+'%'],['Average rounds',d.avg_rounds],['Active',d.active],['LLM runs',d.llm_runs],['Fallback events',d.fallbacks],['Completed',d.completed]].map(x=>`<div class="card stat"><label>${x[0]}</label><b>${x[1]}</b></div>`).join('');document.getElementById('rows').innerHTML=h.length?h.map(x=>`<tr><td><strong>${esc(x.scenario_name)}</strong></td><td>${x.agents.map(a=>esc(a.role_label)).join(' · ')}</td><td>${x.mode==='llm'?'Live LLM':'Mock'}</td><td><span class="status ${x.status}">${x.status.replaceAll('_',' ')}</span></td><td>${x.final_value!=null?money(x.final_value,x.unit):'—'}</td><td>${x.rounds_used}/${x.max_rounds}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No sessions yet. Start your first negotiation.</td></tr>`}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan="6" class="empty">Backend unavailable. Start Flask and reload.</td></tr>`}})();Api.health().then(h=>{const b=document.getElementById('engineBadge');b.innerHTML=`<i></i> ${h.llm.configured?'Live LLM ready':'Mock engine ready'}`;if(h.llm.configured)b.classList.add('live')})
</script></body></html>
