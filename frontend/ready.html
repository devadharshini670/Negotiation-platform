<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review &amp; Launch — AI Multi-Agent Negotiation Platform</title>
<link rel="stylesheet" href="style.css"><script src="api.js"></script></head>
<body><script>document.write(nav('home'))</script>
<main id="main"><div class="wrap">
<div class="eyebrow">Step 03 · Review &amp; launch</div>
<h1 class="page-title">Ready to negotiate.</h1>
<p class="page-sub">Review the configuration before the Orchestrator takes the first turn.</p>
<div class="card review" id="review"></div>
<div id="warn"></div>
<div class="actions"><a class="btn secondary" href="agents.html">← Edit Agent Configuration</a><button class="btn" id="start">Enter Negotiation Area →</button></div>
<div id="err" class="banner error" style="display:none;margin-top:12px"></div>
</div></main>
<script>
(async () => {
  if (!(await authGuard())) return;
  const s = Session.get();
  if (!s.scenarioId || !s.personalityA || !s.personalityB) { location.href = 'index.html'; return; }
  const practice = s.workflowMode === 'practice';
  let sc, llm;
  try { [sc, llm] = await Promise.all([Api.scenarios().then(xs => xs.find(x => x.id === s.scenarioId)), Api.llm()]); }
  catch (e) { const b = document.getElementById('err'); b.style.display = 'block'; b.textContent = e.message; return; }
  const real = s.mode === 'llm' && llm.configured;
  const prov = llm.providers.find(p => p.id === (s.llmProvider || llm.default_provider));
  const pause = !!s.pauseOnError;
  const rows = [
    ['Scenario', sc.name],
    ['Mode', practice ? 'Practice Mode · you negotiate as Agent A' : 'Simulation Mode · AI vs AI'],
    ['Agent A', `${sc.agents[0].role} · ${practice ? 'You (human participant)' : P[s.personalityA].label}`],
    ['Agent B', `${sc.agents[1].role} · ${P[s.personalityB].label}${practice ? ' (AI)' : ''}`],
    ['Reasoning engine', real ? `Real LLM · ${prov ? prov.label : ''} · default model (selected automatically) ${pause ? '(pauses if a call fails)' : '(a failed turn is retried, then clearly marked as a rule-based fallback)'}` : (s.mode === 'llm' ? 'Real LLM requested but no key is configured — the session cannot start in LLM mode' : 'Mock / Rule-Based')],
    ['Maximum rounds', s.maxRounds],
    ['Control model', 'Deterministic Orchestrator + validated agent decisions']
  ];
  document.getElementById('review').innerHTML = rows.map(r => `<div class="review-row"><span>${r[0]}</span><strong>${esc(r[1])}</strong><span></span></div>`).join('');
  if (s.mode === 'llm' && !llm.configured) document.getElementById('warn').innerHTML = '<div class="banner warn" style="margin-top:14px">No Groq or Gemini API key is configured on the server. Go back and choose the rule-based engine, or add a key to backend/.env and restart.</div>';
  const btn = document.getElementById('start');
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = s.mode === 'llm' ? 'Checking the LLM provider…' : 'Initializing…';
    try {
      const n = await Api.create({ scenario_id: s.scenarioId, personality_a: s.personalityA, personality_b: s.personalityB, mode: s.mode, max_rounds: s.maxRounds,
        workflow_mode: s.workflowMode || 'simulation', llm_provider: s.mode === 'llm' ? (s.llmProvider || undefined) : undefined, allow_fallback: !(s.mode === 'llm' && pause) });
      Session.set({ negotiationId: n.id }); location.href = 'negotiation.html';
    } catch (e) { const b = document.getElementById('err'); b.style.display = 'block'; b.textContent = e.message; btn.disabled = false; btn.textContent = 'Enter Negotiation Area →'; }
  };
})();
engineBadge();
</script></body></html>
