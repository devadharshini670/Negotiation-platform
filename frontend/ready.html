<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Readiness — The Table</title><link rel="stylesheet" href="style.css"><script src="api.js"></script></head><body><script>document.write(nav('home'))</script><main><div class="wrap"><div class="eyebrow">Step 03 · Negotiation readiness</div><h1 class="page-title">The table is set.</h1><p class="page-sub">Review the strategy configuration before the Orchestrator takes the first turn.</p><div class="card review" id="review"></div><div class="actions"><a class="btn secondary" href="agents.html">← Edit strategy</a><button class="btn" id="start">Launch negotiation →</button></div><div id="err" class="notice" style="display:none;margin-top:12px"></div></div></main><script>
(async()=>{const s=Session.get();if(!s.scenarioId||!s.personalityA||!s.personalityB){location.href='index.html';return}const xs=await Api.scenarios(),sc=xs.find(x=>x.id===s.scenarioId);const rows=[['Scenario',sc.name],['Agent A',`${sc.agents[0].role} · ${P[s.personalityA].label}`],['Agent B',`${sc.agents[1].role} · ${P[s.personalityB].label}`],['Workflow',s.workflowMode==='practice'?'Practice · You are Agent A':'Simulation · AI vs AI'],['Reasoning engine',s.mode==='llm'?'Real LLM (with safe fallback)':'Mock / Rule-Based'],['Maximum rounds',s.maxRounds],['Control model','Deterministic Orchestrator + validated agent decisions']];document.getElementById('review').innerHTML=rows.map(r=>`<div class="review-row"><span>${r[0]}</span><strong>${esc(r[1])}</strong><span></span></div>`).join('');document.getElementById('start').onclick=async()=>{const b=document.getElementById('start');b.disabled=true;b.textContent='Initializing…';try{const n=await Api.create({scenario_id:s.scenarioId,personality_a:s.personalityA,personality_b:s.personalityB,mode:s.mode,max_rounds:s.maxRounds,workflow_mode:s.workflowMode||'simulation'});Session.set({negotiationId:n.id});location.href='negotiation.html'}catch(e){document.getElementById('err').style.display='block';document.getElementById('err').textContent=e.message;b.disabled=false;b.textContent='Launch negotiation →'}}})();
</script></body></html>
